[package]
name = "clanka"
version = "0.1.0"
description = "Command line and MCP server for clanka companions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "clanka"
path = "src/lib.rs"

[[bin]]
name = "clanka"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clanka-core = { path = "../core", features = ["fastembed"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
getrandom = "0.3"
keyring-core = "1"
toml.workspace = true
rmcp = { version = "3.9", features = ["server", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt", "io-std", "sync"] }
ureq = "3.5"
uuid.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
# The MCP tests talk to the server as a client, over an in-memory pipe.
rmcp = { version = "3.9", features = ["client"] }
tempfile.workspace = true
tokio = { version = "1", features = ["io-util"] }
