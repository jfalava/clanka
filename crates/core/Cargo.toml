[package]
name = "clanka-core"
version = "0.1.0"
description = "Companion memory engine: storage, souls and memory lifecycle, with no transport."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Local embeddings through fastembed (ONNX). Off by default so the core builds without it.
fastembed = ["dep:fastembed"]

[dependencies]
fastembed = { version = "7.6.0", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlite-vec = "0.1.9"
thiserror = "2.0.21"
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
