[package]
name = "clanka-core"
version = "0.1.0"
description = "Companion memory engine: storage, souls and memory lifecycle, with no transport."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Local embeddings through fastembed (ONNX). Off by default so the core builds without it.
fastembed = ["dep:fastembed"]

[dependencies]
fastembed = { version = "7.6.0", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlite-vec = "0.1.9"
thiserror = "2.0.21"
toml.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
