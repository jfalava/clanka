[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/py"]

[workspace.package]
# One version for the workspace and hermes/clanka/plugin.yaml; a release is the
# tag v<version> (AGENTS.md, Releases).
version = "0.4.2"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

# Crates more than one member uses, so their versions are set once.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v7"] }
