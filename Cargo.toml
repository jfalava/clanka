[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/py"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Crates more than one member uses, so their versions are set once.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v7"] }
