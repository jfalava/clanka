# Dependency cooldown: `cargo update` and new dependencies skip crate versions
# published in the last 7 days, the window in which a malicious or broken
# release is usually caught and yanked. Versions already in Cargo.lock stay.
# Cargo 1.100+ applies it; older Cargo ignores it.
#
# A full `cargo update` fails, rather than holding back, while a minimum in a
# Cargo.toml is younger than that (`fastembed = "7.6.0"` a day after 7.6.0
# came out): wait, or update the other crates with `-p`. To take a fresh
# release on purpose, such as a security fix:
#   cargo update -p <crate> --config 'resolver.incompatible-publish-age="allow"'
[registry]
global-min-publish-age = "7 days"
