version = 1

# clanka's own files are AGPL-3.0-only unless an annotation below says
# otherwise. Releases up to and including 0.1.6 were published under MIT.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Jorge Fernando Álava"
SPDX-License-Identifier = "AGPL-3.0-only"

# Copied from the foldcn registry (https://foldcn.elianiva.com,
# github.com/elianiva/foldcn) and restyled; they keep its MIT license.
[[annotations]]
path = [
  "admin/src/components/ui/**",
  "admin/src/lib/icons.ts",
  "admin/src/lib/utils.ts",
  "web/src/components/ui/**",
  "web/src/lib/icons.ts",
  "web/src/lib/utils.ts",
]
SPDX-FileCopyrightText = [
  "2026 elianiva",
  "2026 Jorge Fernando Álava",
]
SPDX-License-Identifier = "MIT"

# Installed from the Nimbus docs registry (@cloudflare/nimbus-docs), MIT.
[[annotations]]
path = "docs/src/components/ui/**"
SPDX-FileCopyrightText = [
  "Cloudflare, Inc.",
  "2026 Jorge Fernando Álava",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "docs/public/fonts/IBMPlexSans-Bold.ttf"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

# web/dist is the built page `clanka web` serves, committed so the Rust build
# needs no Bun. Its script and stylesheet bundle clanka's own code with the
# page's dependencies (docs/src/content/docs/licenses.mdx lists them); its
# fonts are the latin subsets Fontsource packages.
[[annotations]]
path = ["web/dist/index.html", "web/dist/assets/app.js", "web/dist/assets/index.css"]
SPDX-FileCopyrightText = [
  "2026 Jorge Fernando Álava",
  "The authors of the bundled packages",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT AND ISC"

[[annotations]]
path = "web/dist/assets/ibm-plex-sans-*"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "web/dist/assets/zilla-slab-*"
SPDX-FileCopyrightText = "2017 The Zilla Slab Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "web/dist/assets/google-sans-code-*"
SPDX-FileCopyrightText = "2025 The Google Sans Code Project Authors"
SPDX-License-Identifier = "OFL-1.1"
