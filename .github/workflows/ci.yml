name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A known vulnerability in a locked dependency fails here, and `check` is
  # skipped until the dependency moves or deny.toml ignores the advisory.
  advisories:
    uses: ./.github/workflows/advisories.yml
  check:
    needs: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The workspace's rust-version, not a moving stable.
      - name: Install Rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          rustup default "$version"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests need no model provider, keyring, Hermes or network.
      - run: cargo test --workspace --locked
  # The page `clanka web` serves (web/). Its build, web/dist, is committed and
  # compiled into the binary, so the job fails when the committed one is not
  # what the sources build: a change to web/src without `bun run web:build`
  # would ship the old page.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile
      - run: bun run web:check
      - run: bun run web:build
      - name: web/dist is what web/src builds
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist
            echo "::error::web/dist is stale; run \`bun run web:build\` and commit it"
            exit 1
          fi
