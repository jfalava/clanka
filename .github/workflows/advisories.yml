name: Advisories

# RustSec advisories against the locked dependencies (deny.toml). CI calls this
# before its own job on every push and pull request, so nothing is linted or
# tested on a lockfile with a known vulnerability. Weekly as well, so one
# published against a version already locked shows up even when nothing here
# changes. A scheduled run that fails emails whoever last changed this schedule.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
